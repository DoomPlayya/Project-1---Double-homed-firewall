---
- name: Aktivera IP Forwarding i kärnan
  sysctl: 
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes

- name: Rensa gamla iptables-regler (Flush)
  iptables:
    chain: "{{ item }}"
    flush: yes
  loop: [ 'INPUT', 'FORWARD', 'OUTPUT' ]

- name: Tillåt etablerad trafik
  iptables:
    chain: FORWARD
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT

- name: Tillåt Loopback-trafik
  iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT

- name: Tillåt svar på utgående trafik
  iptables:
    chain: INPUT
    ctstate: "ESTABLISHED,RELATED"
    jump: ACCEPT

- name: Sätt default policy ACCEPT på OUTPUT
  iptables:
    chain: OUTPUT
    policy: ACCEPT

- name: Regler för Klient -> Webbserver (Port 80 & 443)
  iptables:
    chain: FORWARD
    protocol: tcp
    source: "{{ client_ip }}"
    destination: "{{ webserver_ip }}"
    destination_port: "{{ item }}"
    jump: ACCEPT
    comment: "VG_RULE: CLIENT_TO_WEB"
  loop: [ "{{ http }}", "{{ https }}" ]

- name: Regler för Webbserver -> Databas (Port 5432)
  iptables:
    chain: FORWARD
    protocol: tcp
    source: "{{ webserver_ip }}"
    destination: "{{ database_ip }}"
    destination_port: "{{ db_port }}"
    jump: ACCEPT

- name: Tillåt DNS-uppslag från interna nätverk
  iptables:
    chain: FORWARD
    protocol: "{{ item }}"
    destination_port: "{{ dns_port }}"
    jump: ACCEPT
  loop: [ 'udp', 'tcp' ]

- name: Tillåt interna maskiner att nå internet (för uppdateringar)
  iptables:
    chain: FORWARD
    protocol: tcp
    source: "{{ item.src }}"
    destination_port: "{{ item.port }}"
    jump: ACCEPT
  loop: 
    - { src: "{{ frontend_net }}", port: "{{ http }}" }
    - { src: "{{ frontend_net }}", port: "{{ https }}" }
    - { src: "{{ dmz_net }}", port: "{{ http }}" }
    - { src: "{{ dmz_net }}", port: "{{ https }}" }

- name: Tillåt inkommande Ping (ICMP)
  iptables:
    chain: INPUT
    protocol: icmp
    icmp_type: echo-request
    jump: ACCEPT

- name: Logga trafik som kommer kastas
  iptables:
    chain: FORWARD
    jump: LOG
    log_prefix: "IPTABLES_DROP: "
    log_level: 4

- name: Begränsa SSH-försök (Brute force protection)
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ ssh_port }}"
    ctstate: NEW
    limit: 3/minute
    limit_burst: 5
    jump: ACCEPT

- name: Lägg till lokal domänuppslagning i /etc/hosts
  become: yes
  lineinfile:
    path: /etc/hosts
    line: "{{ webserver_ip }} {{ my_web_domain }}"
    state: present

- name: Tillåt brandväggen att nå webbservern (för verifiering)
  iptables:
    chain: OUTPUT
    protocol: tcp
    destination: "{{ webserver_ip }}"
    destination_port: "{{ item }}"
    jump: ACCEPT
  loop: [ "{{ http }}", "{{ https }}" ]

- name: Aktivera NAT Masquerade (Gör att svaren hittar hem)
  iptables:
    table: nat
    chain: POSTROUTING
    out_interface: "{{ NET_PORT }}"
    jump: MASQUERADE

- name: Stopp för Klient -> Databas
  iptables:
    chain: FORWARD
    source: "{{ client_ip }}"
    destination: "{{ database_ip }}"
    jump: DROP

- name: Blockera DMZ från att initiera trafik mot Frontend
  iptables:
    chain: FORWARD
    source: "{{ dmz_net }}"
    destination: "{{ frontend_net }}"
    ctstate: NEW
    jump: DROP

- name: Neka all övrig trafik, auto-DROP
  iptables:
    chain: FORWARD
    policy: DROP    

- name: Installera iptables-persistent
  apt:
    name: iptables-persistent
    state: present

- name: Spara iptables-regler till fil
  shell: iptables-save > /etc/iptables/rules.v4

- name: Spara reglerna permanent
  shell: |
    iptables-save > /etc/iptables/rules.v4
    ip6tables-save > /etc/iptables/rules.v6