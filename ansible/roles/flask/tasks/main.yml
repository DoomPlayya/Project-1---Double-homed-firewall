---
- name: Installera Python3 och Pip
  apt:
    name:
      - python3
      - python3-pip
      - libpq-dev
      - postgresql-client
    state: present
    update_cache: yes
  register: apt_result
  until: apt_result is success

- name: Installera Flask och psycopg2 via Pip
  pip:
    name:
      - flask
      - psycopg2-binary
    state: present
    executable: pip3

- name: Kopiera över Flask-appen
  copy:
    src: app.py
    dest: "{{ flask_app_dest }}"
    mode: '0644'
  notify: Restart Flask

- name: Tvinga trafik genom brandväggen genom att ta bort Vagrants default route
  shell: |
    ip route del default via "{{ default_port }}" || true
    ip route replace default via "{{ firewall_dmz_ip }}"
  args:
    executable: /bin/bash

- name: Skapa systemd-tjänst för Flask
  template:
    src: flask.service.j2
    dest: /etc/systemd/system/flask.service
  notify: Restart Flask

- name: Starta Flask-tjänsten
  systemd:
    name: flask
    state: started
    enabled: yes
    daemon_reload: yes

- name: Kopiera requirements.txt
  copy:
    src: requirements.txt
    dest: /home/vagrant/requirements.txt

- name: Installera Python-paket från requirements.txt
  pip:
    requirements: /home/vagrant/requirements.txt
    executable: pip3
